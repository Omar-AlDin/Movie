name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Optional: Allows manual trigger from the Actions tab on GitHub
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

# PREVENTS CANCELLED DEPLOYMENTS
# Ensures only one deployment runs at a time and queued ones wait
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create config.js with secret
        run: |
          echo "const TMDB_ACCESS_TOKEN = '${{ secrets.TMDB_ACCESS_TOKEN }}';" > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        